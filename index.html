<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Judgment Ronin & Nightmare</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body class="home tema-sans">


    <!-- FUNDO -->

    <div class="fundo-estrelas"></div>

    <div class="aura aura-sans"></div>

    <div class="aura aura-nightmare"></div>

    <div id="cursor-glow"></div>


    <!-- TOPO -->

    <header class="topo">

        <span>
            UNDERTALE FAN PROJECT
        </span>


        <span class="status">

            <span class="status-ponto"></span>

            EM DESENVOLVIMENTO

        </span>

    </header>


    <!-- HOME -->

    <main class="inicio">


        <p class="selo">
            JUSTIÇA &nbsp;//&nbsp; VAZIO
        </p>


        <h1 class="titulo">

            <span class="sans">
                Judgment Ronin
            </span>

            <span class="e">
                &
            </span>

            <span class="nightmare">
                Nightmare
            </span>

        </h1>


        <div class="dualidade">

            <span class="linha-sans"></span>

            <span class="centro-dualidade"></span>

            <span class="linha-nightmare"></span>

        </div>


        <p
            class="frase fala-sans"
            id="frase-destaque"
        >
            "Seu erro? Demorar para perceber que eu não desistiria..."
        </p>


        <p class="subtitulo">
            UMA HISTÓRIA SOBRE JUSTIÇA, VAZIO E ESCOLHAS
        </p>


        <nav class="menu">

            <a href="historia.html">
                História
            </a>

            <a href="personagens.html">
                Personagens
            </a>

            <button
                class="menu-em-breve"
                type="button"
                disabled
            >
                Músicas
            </button>

            <button
                class="menu-em-breve"
                type="button"
                disabled
            >
                Galeria
            </button>

        </nav>


        <a
            class="entrar"
            href="historia.html"
        >
            COMEÇAR A HISTÓRIA
        </a>

    </main>


    <!-- PLAYER -->

    <div class="player-musica">

        <span class="tocando-agora">
            TOCANDO AGORA
        </span>

        <button
            id="botao-musica"
            type="button"
        >
            ▶ The Duo
        </button>

        <audio
            id="musica-fundo"
            preload="metadata"
        ></audio>

    </div>


    <script src="script.js"></script>

</body>

</html>
